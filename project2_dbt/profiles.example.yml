# Copy to ~/.dbt/profiles.yml and replace the project id. Authentication uses `gcloud auth application-default login`.
project2_dbt:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: your-gcp-project-id
      dataset: project2_staging
      location: US
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
